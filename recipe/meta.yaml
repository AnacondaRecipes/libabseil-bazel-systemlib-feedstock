{% set version = libabseil %}

package:
  name: libabseil-bazel-systemlib
  version: "{{ version }}"

source:
  url: https://github.com/abseil/abseil-cpp/archive/refs/tags/{{ version }}.0.tar.gz
  sha256: 6e1aee535473414164bf83e4ebc40240dec71a4701f8a642d906e95bea1aea0c

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - sed
  host:
    - libabseil {{ libabseil }}
  run:
    - libabseil {{ libabseil }}

test:
  requires:
    - {{ stdlib('c') }}
    - cxx-compiler
    - c-compiler
    - bazel >=8
    - bazel-toolchain >=0.5.6
    - libabseil {{ version }}.*
  files:
    - tests/
  commands:
    - test -f ${PREFIX}/share/bazel/systemlibs/absl/BUILD
    - bash tests/run_test.sh

about:
  home: https://github.com/abseil/abseil-cpp
  dev_url: https://github.com/conda-forge/libabseil-bazel-systemlib-feedstock
  doc_url: https://github.com/conda-forge/libabseil-bazel-systemlib-feedstock
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Bazel systemlib definitions for abseil
  description: |
    You can use the systemlib definitions by assembling them together with
    the following lines in your build script:

    ```bash
    mkdir -p ./third_party/systemlibs
    cp -ap "${PREFIX}/share/bazel/systemlibs/absl" third_party/systemlibs/
    ```

    You will also need an override in the top-level `MODULE.bazel`:

    ```python
    local_path_override(
        module_name = "abseil-cpp",
        path = "./third_party/systemlibs/absl",
    )
    ```

extra:
  recipe-maintainers:
    - conda-forge/bazel
